<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSRD / ESRS Report Draft Generator</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Helvetica Neue',Helvetica,Arial,-apple-system,BlinkMacSystemFont,sans-serif;
  --paper:#F7F6F3;--paper2:#EFEDE7;--card:#FFFFFF;
  --ink:#1A1A1A;--mut:#5C5A55;--fnt:#A29E96;
  --line:rgba(26,26,26,.12);--line2:rgba(26,26,26,.22);
  --req:#C0392B;--req-bg:#FCEDEB;
  --ok:#2E6B4F;--ok-bg:#EAF3EE;
  --forest:#173B2E;--forest2:#0E2620;--gold:#B8924A;--gold-lt:#E8D5A8;
}
body{background:var(--paper);font-family:var(--font);color:var(--ink);min-height:100vh}
a{color:inherit}

/* ── SHELL ── */
.shell{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
@media(max-width:860px){.shell{grid-template-columns:1fr}.nav{display:none}}

/* ── NAV ── */
.nav{background:var(--paper2);border-right:1px solid var(--line);padding:1.75rem 0;position:sticky;top:0;height:100vh;overflow-y:auto}
.nav-brand{padding:0 1.5rem 1.5rem;border-bottom:1px solid var(--line);margin-bottom:1rem}
.nav-brand .k{font-size:11px;letter-spacing:.06em;color:var(--mut)}
.nav-brand h1{font-size:1.05rem;font-weight:700;line-height:1.3;margin-top:.3rem}
.nav-group{padding:0 1.5rem;margin-bottom:1.4rem}
.nav-group-l{font-size:10.5px;color:var(--fnt);font-weight:700;margin-bottom:.5rem}
.nav-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 10px;margin:0 -10px;border-radius:5px;cursor:pointer;font-size:13.5px;color:var(--mut);transition:background .12s}
.nav-item:hover{background:rgba(26,26,26,.05)}
.nav-item.on{background:var(--card);color:var(--ink);font-weight:700;border:1px solid var(--line)}
.nav-item .dot{width:6px;height:6px;border-radius:50%;background:var(--fnt);flex-shrink:0}
.nav-item.filled .dot{background:var(--ok)}

/* ── MAIN ── */
.main{padding:2.5rem 3rem 6rem;max-width:760px}
@media(max-width:860px){.main{padding:1.5rem 1.25rem 4rem}}
.top{margin-bottom:2.25rem}
.top .k{font-size:11px;letter-spacing:.06em;color:var(--mut)}
.top h2{font-size:1.9rem;font-weight:700;line-height:1.15;margin-top:.4rem}
.top p{font-size:14px;color:var(--mut);margin-top:.6rem;max-width:58ch;line-height:1.55}

.field{margin-bottom:1.5rem}
.field label{display:block;font-size:13.5px;font-weight:700;margin-bottom:.35rem}
.field .req{color:var(--req);font-weight:700;margin-left:2px}
.field .hint{font-size:12.5px;color:var(--mut);margin-bottom:.5rem;line-height:1.5}
.field input[type=text],.field input[type=number],.field textarea{
  width:100%;padding:10px 12px;border:1px solid var(--line2);border-radius:6px;
  background:var(--card);font-family:var(--font);font-size:14px;color:var(--ink);
  outline:none;transition:border .15s
}
.field input:focus,.field textarea:focus{border-color:var(--ink)}
.field textarea{min-height:88px;resize:vertical;line-height:1.5}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
@media(max-width:520px){.row2{grid-template-columns:1fr}}
.unit{font-size:12px;color:var(--mut);margin-top:4px}

.section-nav{display:flex;justify-content:space-between;padding-top:2rem;margin-top:2rem;border-top:1px solid var(--line)}
.snbtn{padding:10px 18px;border-radius:6px;border:1px solid var(--line2);background:var(--card);font-family:var(--font);font-size:13.5px;font-weight:700;cursor:pointer;transition:all .15s}
.snbtn:hover{border-color:var(--ink)}
.snbtn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.snbtn.primary:hover{background:#333}
.snbtn:disabled{opacity:.35;cursor:default}

/* ── PROGRESS ── */
.prog-wrap{padding:0 1.5rem;margin-bottom:1.2rem}
.prog-track{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--ok);transition:width .2s}
.prog-l{font-size:11px;color:var(--mut);margin-top:5px}

/* ── COMPANY BAR ── */
.co-bar{background:var(--card);border-bottom:1px solid var(--line);padding:.9rem 3rem;display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}
@media(max-width:860px){.co-bar{padding:.9rem 1.25rem}}
.co-bar .field{margin:0;flex:1;min-width:160px}
.co-bar label{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut);margin-bottom:.25rem}
.co-bar input{padding:6px 8px;font-size:13px}

/* ── COVER ── */
.cover{
  background:linear-gradient(155deg,var(--forest) 0%,var(--forest2) 100%);
  color:var(--gold-lt);padding:4rem 3.5rem 3.5rem;margin:-3rem -3.5rem 3rem;
  position:relative;overflow:hidden;page-break-after:always;
}
@media(max-width:860px){.cover{padding:3rem 1.5rem 2.5rem;margin:-1.75rem -1.5rem 2.5rem}}
.cover::before{
  content:'';position:absolute;right:-60px;top:-60px;width:280px;height:280px;
  border:1px solid rgba(232,213,168,.18);border-radius:50%;
}
.cover::after{
  content:'';position:absolute;right:20px;bottom:-90px;width:200px;height:200px;
  border:1px solid rgba(232,213,168,.12);border-radius:50%;
}
.cover-k{font-size:12px;letter-spacing:.08em;color:var(--gold);font-weight:700;position:relative;z-index:1}
.cover-bar{width:36px;height:3px;background:var(--gold);margin:.9rem 0 1.4rem;position:relative;z-index:1}
.cover h1{font-size:2.6rem;font-weight:700;line-height:1.08;color:#fff;position:relative;z-index:1;max-width:14ch}
.cover .co{font-size:16px;color:rgba(232,213,168,.85);margin-top:.7rem;position:relative;z-index:1}
.cover-meta{display:flex;gap:2.2rem;margin-top:2.5rem;flex-wrap:wrap;position:relative;z-index:1}
.cover-meta div{font-size:11px;color:rgba(232,213,168,.65);text-transform:uppercase;letter-spacing:.04em}
.cover-meta strong{display:block;font-size:1.4rem;color:#fff;text-transform:none;letter-spacing:0;margin-top:.2rem;font-weight:700}

/* ── REPORT VIEW ── */
.report{display:none;background:var(--card);max-width:820px;margin:2.5rem auto;padding:3rem 3.5rem;box-shadow:0 1px 3px rgba(0,0,0,.08)}
@media(max-width:860px){.report{padding:1.75rem 1.5rem;margin:1.5rem}}
.report.on{display:block}
.rep-head{border-bottom:3px solid var(--ink);padding-bottom:1.5rem;margin-bottom:2rem}
.rep-head .k{font-size:11px;letter-spacing:.06em;color:var(--mut)}
.rep-head h1{font-size:2rem;font-weight:700;margin:.4rem 0}
.rep-head .co{font-size:15px;color:var(--mut)}
.rep-meta{display:flex;gap:2rem;margin-top:1.2rem;flex-wrap:wrap}
.rep-meta div{font-size:11.5px}
.rep-meta strong{display:block;font-size:13px;margin-bottom:2px}
.rep-sec{margin-bottom:2.2rem;page-break-inside:avoid}
.rep-sec h2{font-size:1.15rem;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:.5rem;margin-bottom:.9rem}
.rep-sec h2 .code{font-family:monospace;font-size:11px;color:var(--mut);font-weight:400;margin-right:8px}
.rep-field{margin-bottom:1rem}
.rep-field .fl{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:.2rem;text-transform:uppercase;letter-spacing:.03em}
.rep-field .fv{font-size:14.5px;line-height:1.6;white-space:pre-wrap}
.rep-field .fv.empty{color:var(--fnt);font-style:normal}
.rep-field .fv.metric{font-size:1.4rem;font-weight:700}
.rep-empty-note{background:var(--req-bg);border-left:3px solid var(--req);padding:.6rem .9rem;font-size:12.5px;color:#7A2018;border-radius:0 4px 4px 0}
.rep-disclaimer{background:var(--paper2);border-radius:8px;padding:1.2rem 1.4rem;font-size:12px;color:var(--mut);line-height:1.6;margin-top:2.5rem}
.rep-disclaimer strong{color:var(--ink)}

.actions-bar{max-width:820px;margin:0 auto 1rem;padding:0 0;display:flex;gap:.6rem;justify-content:flex-end}
@media print{
  .nav,.co-bar,.main,.actions-bar,.snbtn{display:none!important}
  .report{display:block!important;box-shadow:none;margin:0;padding:0;max-width:100%}
  body{background:#fff}
}
</style>
</head>
<body>

<div class="co-bar" id="coBar">
  <div class="field">
    <label>Company name</label>
    <input type="text" id="coName" placeholder="Company name">
  </div>
  <div class="field">
    <label>Reporting period</label>
    <input type="text" id="coPeriod" placeholder="e.g. FY2026">
  </div>
  <div class="field">
    <label>Sector</label>
    <input type="text" id="coSector" placeholder="e.g. Textiles">
  </div>
</div>

<div class="shell">
  <div class="nav" id="nav">
    <div class="nav-brand">
      <div class="k">Draft generator</div>
      <h1>CSRD / ESRS<br>Report Builder</h1>
    </div>
    <div class="prog-wrap">
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
      <div class="prog-l" id="progL">0 of 12 sections started</div>
    </div>
    <!-- nav groups injected by JS -->
    <div id="navGroups"></div>
  </div>

  <div class="main" id="main"></div>
</div>

<div class="actions-bar" id="actionsBar" style="display:none">
  <button class="snbtn" onclick="backToForm()">← Edit answers</button>
  <button class="snbtn primary" onclick="window.print()">Print / Save as PDF</button>
</div>
<div class="report" id="report"></div>

<script>
// ── ESRS STRUCTURE ──
// A representative set of the most commonly reported disclosure
// requirements per topical standard — not the full mandatory datapoint
// set (which runs to hundreds of items across ESRS 1–2 and E1–G1).
// This produces a structured first draft, not a compliance filing.
const SECTIONS = [
  { id:'gen', group:'General', code:'ESRS 2', title:'General Disclosures', desc:'Governance, strategy, and how sustainability matters were identified.',
    fields:[
      {id:'g1',label:'Governance body responsible for sustainability oversight',type:'text',req:true,hint:'e.g. "Sustainability Committee, reporting to the Board"'},
      {id:'g2',label:'Business model and value chain description',type:'textarea',req:true},
      {id:'g3',label:'Material impacts, risks and opportunities identified',type:'textarea',req:true,hint:'Summary of your double materiality assessment outcome.'},
      {id:'g4',label:'Stakeholders consulted in materiality assessment',type:'textarea',req:false},
    ]},
  { id:'e1', group:'Environmental', code:'ESRS E1', title:'Climate Change', desc:'GHG emissions, energy, and climate transition plan.',
    fields:[
      {id:'e1_1',label:'Scope 1 GHG emissions',type:'number',unit:'tCO2e',req:true},
      {id:'e1_2',label:'Scope 2 GHG emissions (location-based)',type:'number',unit:'tCO2e',req:true},
      {id:'e1_3',label:'Scope 3 GHG emissions',type:'number',unit:'tCO2e',req:false},
      {id:'e1_4',label:'Total energy consumption',type:'number',unit:'MWh',req:false},
      {id:'e1_5',label:'Share of energy from renewable sources',type:'number',unit:'%',req:false},
      {id:'e1_6',label:'Climate transition plan summary',type:'textarea',req:true,hint:'Targets, milestones, and decarbonisation levers.'},
    ]},
  { id:'e2', group:'Environmental', code:'ESRS E2', title:'Pollution', desc:'Air, water, soil pollutants and substances of concern.',
    fields:[
      {id:'e2_1',label:'Pollutants emitted to air, water or soil',type:'textarea',req:false},
      {id:'e2_2',label:'Use of substances of concern / very high concern',type:'textarea',req:false},
      {id:'e2_3',label:'Pollution prevention and control measures',type:'textarea',req:false},
    ]},
  { id:'e3', group:'Environmental', code:'ESRS E3', title:'Water & Marine Resources', desc:'Water withdrawal, consumption and marine impact.',
    fields:[
      {id:'e3_1',label:'Total water consumption',type:'number',unit:'m³',req:false},
      {id:'e3_2',label:'Water withdrawn from areas at water risk',type:'number',unit:'m³',req:false},
      {id:'e3_3',label:'Water management policy summary',type:'textarea',req:false},
    ]},
  { id:'e4', group:'Environmental', code:'ESRS E4', title:'Biodiversity & Ecosystems', desc:'Impacts on biodiversity, land use, and ecosystem services.',
    fields:[
      {id:'e4_1',label:'Sites in or near biodiversity-sensitive areas',type:'textarea',req:false},
      {id:'e4_2',label:'Land use change caused by operations',type:'textarea',req:false},
      {id:'e4_3',label:'Biodiversity protection or restoration measures',type:'textarea',req:false},
    ]},
  { id:'e5', group:'Environmental', code:'ESRS E5', title:'Resource Use & Circular Economy', desc:'Material inflows, waste, and circularity.',
    fields:[
      {id:'e5_1',label:'Total waste generated',type:'number',unit:'tonnes',req:false},
      {id:'e5_2',label:'Share of waste diverted from disposal (recycled/reused)',type:'number',unit:'%',req:false},
      {id:'e5_3',label:'Circular economy initiatives',type:'textarea',req:false},
    ]},
  { id:'s1', group:'Social', code:'ESRS S1', title:'Own Workforce', desc:'Working conditions, equal treatment, and employee data.',
    fields:[
      {id:'s1_1',label:'Total number of employees',type:'number',unit:'headcount',req:true},
      {id:'s1_2',label:'Gender pay gap',type:'number',unit:'%',req:false},
      {id:'s1_3',label:'Employee turnover rate',type:'number',unit:'%',req:false},
      {id:'s1_4',label:'Health & safety incident rate',type:'text',req:false},
      {id:'s1_5',label:'Training and skills development programmes',type:'textarea',req:false},
    ]},
  { id:'s2', group:'Social', code:'ESRS S2', title:'Workers in the Value Chain', desc:'Labour conditions across suppliers and contractors.',
    fields:[
      {id:'s2_1',label:'Supplier code of conduct / labour standards',type:'textarea',req:false},
      {id:'s2_2',label:'Due diligence process for value chain workers',type:'textarea',req:false},
    ]},
  { id:'s3', group:'Social', code:'ESRS S3', title:'Affected Communities', desc:'Impacts on local communities and indigenous peoples.',
    fields:[
      {id:'s3_1',label:'Communities affected by operations',type:'textarea',req:false},
      {id:'s3_2',label:'Community engagement and grievance mechanisms',type:'textarea',req:false},
    ]},
  { id:'s4', group:'Social', code:'ESRS S4', title:'Consumers & End-Users', desc:'Product safety, information, and consumer impact.',
    fields:[
      {id:'s4_1',label:'Product safety and quality processes',type:'textarea',req:false},
      {id:'s4_2',label:'Consumer data privacy measures',type:'textarea',req:false},
    ]},
  { id:'g1s', group:'Governance', code:'ESRS G1', title:'Business Conduct', desc:'Anti-corruption, whistleblowing, and supplier relations.',
    fields:[
      {id:'g1s_1',label:'Anti-corruption and anti-bribery policy',type:'textarea',req:true},
      {id:'g1s_2',label:'Whistleblowing / grievance mechanism',type:'textarea',req:false},
      {id:'g1s_3',label:'Payment practices toward suppliers (esp. SMEs)',type:'textarea',req:false},
    ]},
];

let DATA = {};
let current = 0;

function buildNav(){
  const groups = [...new Set(SECTIONS.map(s=>s.group))];
  let html='';
  groups.forEach(g=>{
    html += `<div class="nav-group"><div class="nav-group-l">${g}</div>`;
    SECTIONS.forEach((s,i)=>{
      if(s.group!==g) return;
      html += `<div class="nav-item" data-i="${i}" onclick="goTo(${i})">
        <span>${s.title}</span><span class="dot"></span>
      </div>`;
    });
    html += `</div>`;
  });
  document.getElementById('navGroups').innerHTML = html;
}

function goTo(i){
  saveCurrent();
  current = i;
  renderForm();
}

function saveCurrent(){
  const s = SECTIONS[current];
  s.fields.forEach(f=>{
    const el = document.getElementById(f.id);
    if(el) DATA[f.id] = el.value;
  });
}

function isFilled(s){
  return s.fields.some(f => (DATA[f.id]||'').trim().length>0);
}

function updateProgress(){
  const filled = SECTIONS.filter(isFilled).length;
  document.getElementById('progFill').style.width = (filled/SECTIONS.length*100)+'%';
  document.getElementById('progL').textContent = `${filled} of ${SECTIONS.length} sections started`;
  document.querySelectorAll('.nav-item').forEach((el,i)=>{
    el.classList.toggle('on', i===current);
    el.classList.toggle('filled', isFilled(SECTIONS[i]));
  });
}

function fieldHTML(f){
  const val = DATA[f.id]||'';
  const req = f.req ? '<span class="req">*</span>' : '';
  const hint = f.hint ? `<div class="hint">${f.hint}</div>` : '';
  if(f.type==='textarea'){
    return `<div class="field"><label>${f.label}${req}</label>${hint}<textarea id="${f.id}">${val}</textarea></div>`;
  }
  if(f.type==='number'){
    return `<div class="field"><label>${f.label}${req}</label>${hint}<input type="number" id="${f.id}" value="${val}"><div class="unit">${f.unit||''}</div></div>`;
  }
  return `<div class="field"><label>${f.label}${req}</label>${hint}<input type="text" id="${f.id}" value="${val}"></div>`;
}

function renderForm(){
  const s = SECTIONS[current];
  const html = `
    <div class="top">
      <div class="k">${s.code} · ${s.group}</div>
      <h2>${s.title}</h2>
      <p>${s.desc}</p>
    </div>
    ${s.fields.map(fieldHTML).join('')}
    <div class="section-nav">
      <button class="snbtn" onclick="prevSection()" ${current===0?'disabled':''}>← Previous</button>
      ${current === SECTIONS.length-1
        ? '<button class="snbtn primary" onclick="generateReport()">Generate report →</button>'
        : '<button class="snbtn primary" onclick="nextSection()">Next →</button>'}
    </div>
  `;
  document.getElementById('main').innerHTML = html;
  updateProgress();
}

function nextSection(){ saveCurrent(); if(current<SECTIONS.length-1){current++;renderForm();} }
function prevSection(){ saveCurrent(); if(current>0){current--;renderForm();} }

function generateReport(){
  saveCurrent();
  const co = document.getElementById('coName').value || 'Company name not set';
  const period = document.getElementById('coPeriod').value || 'Reporting period not set';
  const sector = document.getElementById('coSector').value || '—';

  let missing = [];
  let secHTML = '';
  SECTIONS.forEach(s=>{
    let fieldsHTML='';
    s.fields.forEach(f=>{
      const val = (DATA[f.id]||'').trim();
      if(f.req && !val) missing.push(`${s.code} — ${f.label}`);
      const display = val
        ? `<div class="fv ${f.type==='number'?'metric':''}">${val}${f.type==='number' && f.unit ? ' '+f.unit : ''}</div>`
        : `<div class="fv empty">Not provided</div>`;
      fieldsHTML += `<div class="rep-field"><div class="fl">${f.label}</div>${display}</div>`;
    });
    secHTML += `<div class="rep-sec"><h2><span class="code">${s.code}</span>${s.title}</h2>${fieldsHTML}</div>`;
  });

  const missingNote = missing.length
    ? `<div class="rep-empty-note"><strong>${missing.length} required field(s) not yet completed:</strong> ${missing.join(' · ')}</div>`
    : '';

  document.getElementById('report').innerHTML = `
    <div class="cover">
      <div class="cover-k">Sustainability Statement — Draft</div>
      <div class="cover-bar"></div>
      <h1>${co}</h1>
      <div class="co">${sector}</div>
      <div class="cover-meta">
        <div>Reporting period<strong>${period}</strong></div>
        <div>Sections started<strong>${SECTIONS.filter(isFilled).length} / ${SECTIONS.length}</strong></div>
        <div>Required fields outstanding<strong>${missing.length}</strong></div>
      </div>
    </div>
    ${missingNote}
    ${secHTML}
    <div class="rep-disclaimer">
      <strong>About this draft.</strong> This document was generated from
      the inputs provided and follows the topical structure of ESRS 1–2
      and E1–G1. It covers a representative set of commonly reported
      disclosure requirements, not the full mandatory datapoint set under
      CSRD, and has not undergone assurance. Use it as a working first
      draft, not as a final compliance filing — a qualified sustainability
      or assurance professional should review it before publication.
    </div>
  `;

  document.getElementById('report').classList.add('on');
  document.getElementById('main').style.display='none';
  document.getElementById('nav').style.display='none';
  document.getElementById('coBar').style.display='none';
  document.getElementById('actionsBar').style.display='flex';
  window.scrollTo({top:0,behavior:'smooth'});
}

function backToForm(){
  document.getElementById('report').classList.remove('on');
  document.getElementById('main').style.display='block';
  document.getElementById('nav').style.display='block';
  document.getElementById('coBar').style.display='flex';
  document.getElementById('actionsBar').style.display='none';
  renderForm();
}

buildNav();
renderForm();
</script>
</body>
</html>
